dependencies {
    // 音频处理（仅用于麦克风输入，不使用 MFCC 功能）
    jarJar(additionalRuntimeClasspath(implementation('be.tarsos.dsp:core:2.5')))
    jarJar(additionalRuntimeClasspath(implementation('be.tarsos.dsp:jvm:2.5')))

    // === DJL 核心库 ===
    jarJar(additionalRuntimeClasspath(implementation('ai.djl:api:0.36.0') {
        exclude group: 'com.google.code.gson', module: 'gson'
        exclude group: 'net.java.dev.jna', module: 'jna'
        exclude group: 'org.apache.commons', module: 'commons-compress'
        exclude group: 'org.slf4j', module: 'slf4j-api'
    }))

    // === DJL PyTorch 引擎 ===
    jarJar(additionalRuntimeClasspath(implementation('ai.djl.pytorch:pytorch-engine:0.36.0') {
        exclude group: 'com.google.code.gson', module: 'gson'
        exclude group: 'net.java.dev.jna', module: 'jna'
        exclude group: 'org.apache.commons', module: 'commons-compress'
        exclude group: 'org.slf4j', module: 'slf4j-api'
    }))

    jarJar(implementation("dev.anvilcraft.lib:anvillib-config-neoforge-1.21.1:2.0.0+snapshot.216"))
    jarJar(implementation("dev.anvilcraft.lib:anvillib-registrum-neoforge-1.21.1:2.0.0+snapshot.216"))

    // Curios
    compileOnly("top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1:api")
    runtimeOnly("top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1")
    // Iron's Spells 'n Spellbooks
    compileOnly("io.redspace:irons_spellbooks:1.21.1-3.14.8:api")
    runtimeOnly("io.redspace:irons_spellbooks:1.21.1-3.14.8")
    // GeckoLib
    implementation('software.bernie.geckolib:geckolib-neoforge-1.21.1:4.8.2')
    // Player Animation Lib
    implementation("dev.kosmx.player-anim:player-animation-lib-forge:2.0.1+1.21.1")
}
